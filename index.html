      <input class="i" id="pr-busca" placeholder="Buscar ${porLinha ? 'linha' : 'produto'}…" value="${esc(S.prodBusca)}">
      <div class="help" style="margin:8px 2px">${listaF.length} ${porLinha ? 'linha(s)' : 'produto(s)'} vendidos em ${esc(LA)}</div>
      <div class="prod-items">
        ${listaF.map(it => `<button class="prod-item${it.k === sel ? ' on' : ''}" data-k="${esc(it.k)}"><span class="pi-name">${esc(it.k)}</span><span class="pi-meta"><span class="num">${fmtBRL(it.val)}</span> · ${it.cli.size} cli.</span><span class="minibar" style="width:${Math.max(2, it.val / maxV * 100)}%"></span></button>`).join('') || '<div class="empty">Nada encontrado.</div>'}
      </div>
    </aside>
    <section style="min-width:0">
      <div class="card" style="margin-bottom:14px"><div class="ccode">${porLinha ? 'Linha de produto' : 'Produto · linha ' + esc(linhaDe(sel))}</div><h2 style="font-size:19px;margin-top:2px">${esc(sel)}</h2><p class="sub" style="margin:4px 0 0">${esc(LA)} · ${esc(vendNome)}</p></div>
      <div class="grid g4">
        ${kpi('Venda líquida', fmtBRL(item.val), item.val, S.cmp ? valB : null)}
        ${kpi('Clientes que compraram', `${fmtN(nComp)} <span class="ccode" style="font-size:14px">de ${fmtN(universo.size)}</span>`, nComp, S.cmp ? compB.size : null)}
        ${kpi('Cobertura da carteira', fmtN(cobertura, 1) + '%', cobertura, cobB, S.prodUniv === 'carteira' ? 'sobre toda a carteira' : 'sobre os clientes que compraram no período')}
        ${porLinha ? kpi('Produtos da linha vendidos', fmtN(item.prods.size), 0, null) : kpi('Preço médio (venda ÷ qtde)', fmtBRL(precoA), precoA, precoB, fmtN(item.q) + ' unidades')}
      </div>
      <div class="grid g2" style="margin-top:14px">
        <div class="card"><h2>Venda mês a mês</h2><p class="sub">${S.mes === 'A' ? 'Todos os meses' : 'Meses de ' + S.ano} · ${esc(vendNome)}</p><div class="chart-box" style="height:230px"><canvas id="ch-pr-evol" role="img" aria-label="Venda mensal do item"></canvas></div></div>
        <div class="card"><h2>Cobertura por vendedor</h2><p class="sub">% dos clientes ativos de cada vendedor que compraram ${porLinha ? 'algo da linha' : 'o produto'} · ${esc(LA)}</p>
          <table class="t"><thead><tr><th>Vendedor</th><th class="r">Compraram</th><th class="r">Venda</th><th style="width:34%">Cobertura</th></tr></thead><tbody>
          ${covRows.map(v => `<tr${S.vend === v.vc ? ' style="background:var(--surface-2)"' : ''}><td>${esc(S.vendNome[v.vc] || v.vc)}</td><td class="r num">${v.nc} de ${v.na}</td><td class="r num">${fmtBRL(v.val)}</td><td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;background:var(--surface-2);border-radius:3px;height:8px"><div class="minibar" style="margin:0;height:8px;width:${Math.max(v.pct ? 2 : 0, v.pct)}%"></div></div><span class="num" style="min-width:44px;text-align:right">${fmtN(v.pct, 0)}%</span></div></td></tr>`).join('')}
          </tbody></table></div>
      </div>
      ${porLinha ? `<div class="card" style="margin-top:14px"><h2>Produtos da linha</h2><p class="sub">Clique para abrir o produto</p><div class="tbl-wrap" style="max-height:300px"><table class="t"><thead><tr><th>Produto</th><th class="r">Qtde</th><th class="r">Venda</th><th class="r">Clientes</th></tr></thead><tbody>

      </div>
      <div class="grid" style="margin-top:10px">
        <div class="card"><h2 style="color:var(--good)">✓ Compraram · ${fmtN(nComp)}</h2><p class="sub">${esc(LA)}${S.cmp ? ' · comparado com ' + esc(LB) : ''}</p>
          ${compradores.length ? `<div class="soma-bar" id="pr-soma"></div>
          <div class="tbl-wrap" style="max-height:560px"><table class="t" id="pr-comp"><thead><tr><th class="chk"><input type="checkbox" id="pr-all" title="Marcar todos" aria-label="Marcar todos"></th>${thS('C', 'nome', 'Cliente')}${porLinha ? thS('C', 'prods', 'Produtos', 1) : ''}${thS('C', 'q', 'Qtde', 1)}${thS('C', 'val', 'Venda', 1)}${S.cmp ? thS('C', 'cmp', esc(perLabelCurto(S.cmp)), 1) : ''}</tr></thead><tbody>
          ${compradores.map(([cc, c]) => `<tr class="click" data-cc="${esc(cc)}"><td class="chk"><input type="checkbox" data-marc="${esc(cc)}" ${S.prodMarc.has(cc) ? 'checked' : ''} aria-label="Somar ${esc(nomeDe(cc))}"></td><td><div class="cname">${esc(nomeDe(cc))}</div><div class="ccode">cód. ${esc(cc)}${S.vend ? '' : ' · ' + esc(vendDe(cc))}</div></td>${porLinha ? `<td class="r num">${c.prods.size}</td>` : ''}<td class="r num">${fmtQ(c.q)}</td><td class="r num">${fmtBRL(c.val)}</td>${S.cmp ? `<td class="r">${compB.get(cc) ? deltaHTML(c.val, compB.get(cc)) : '<span class="badge ok">novo</span>'}</td>` : ''}</tr>`).join('')}
          </tbody><tfoot><tr><td></td><td><b>Total · ${fmtN(nComp)} cliente(s)</b></td>${porLinha ? `<td class="r num"><b>${fmtN(item.prods.size)}</b></td>` : ''}<td class="r num"><b>${fmtQ(totQ)}</b></td><td class="r num"><b>${fmtBRL(totV)}</b></td>${S.cmp ? `<td class="r">${deltaHTML(totV, totCmp)}</td>` : ''}</tr></tfoot></table></div>` : '<div class="empty">Ninguém comprou neste período.</div>'}</div>
        <div class="card"><h2 style="color:var(--crit)">✕ Não compraram · ${fmtN(nao.length)}</h2><p class="sub">${S.cmp && perdidos ? `<b>${perdidos}</b> compravam em ${esc(LB)} e pararam · ` : ''}oportunidades de venda, com quem já comprou antes no topo</p>
          ${nao.length ? `<div class="tbl-wrap" style="max-height:480px"><table class="t"><thead><tr>${thS('N', 'nome', 'Cliente')}${thS('N', 'hist', 'Histórico ' + (porLinha ? 'da linha' : 'do produto'))}${thS('N', 'tot', 'Compra total no período (todos os produtos)', 1)}</tr></thead><tbody>
          ${nao.map(x => `<tr class="click" data-cc="${esc(x.cc)}"><td><div class="cname">${esc(nomeDe(x.cc))}</div><div class="ccode">cód. ${esc(x.cc)}${S.vend ? '' : ' · ' + esc(vendDe(x.cc))}</div></td><td>${x.emB ? `<span class="badge crit">Parou (comprava em ${esc(perLabelCurto(S.cmp))})</span>` : x.ult ? `<span class="badge warn">Já comprou · ${mesLabel(x.ult)}</span>` : '<span class="badge gray">Nunca comprou</span>'}</td><td class="r num">${x.tot ? fmtBRL(x.tot) : '<span class="ccode">sem compra</span>'}</td></tr>`).join('')}
          </tbody></table></div>` : '<div class="empty">Todos os clientes compraram. 🎉</div>'}</div>
      </div>
    </section>
  </div>`;

  // gráfico mensal do item
  const ms = S.mes === 'A' ? S.meses : S.meses.filter(m => m.startsWith(S.ano));
  const selM = new Set(perMeses(S.mes)), cmpM = new Set(S.cmp ? perMeses(S.cmp) : []);

    const marc = [...S.prodMarc].filter(cc => compMap.has(cc));
    const q = marc.reduce((s, cc) => s + compMap.get(cc).q, 0), v = marc.reduce((s, cc) => s + compMap.get(cc).val, 0);

    bar.innerHTML = marc.length
      ? `<span><b>${marc.length}</b> cliente(s) marcado(s)</span><span>Qtde: <b class="num">${fmtQ(q)}</b></span><span>Venda: <b class="num">${fmtBRL(v)}</b></span><span class="ccode">${fmtN(totQ ? q / totQ * 100 : 0, 1)}% da quantidade total</span><button class="btn sm" id="pr-limpar">Limpar</button>`
      : `<span class="help">Marque os clientes na primeira coluna para ir somando a quantidade e o valor. Total geral: <b class="num">${fmtQ(totQ)}</b> unidades, <b class="num">${fmtBRL(totV)}</b>.</span>`;

  };
  $$('[data-marc]').forEach(cb => cb.addEventListener('change', () => { if (cb.checked) S.prodMarc.add(cb.dataset.marc); else S.prodMarc.delete(cb.dataset.marc); atualizarSoma(); }));
  $('#pr-all')?.addEventListener('change', e => { const on = e.target.checked; compradores.forEach(([cc]) => on ? S.prodMarc.add(cc) : S.prodMarc.delete(cc)); $$('[data-marc]').forEach(c => c.checked = on); atualizarSoma(); });
  atualizarSoma();
  const inp = $('#pr-busca'); inp.addEventListener('input', () => { S.prodBusca = inp.value; const pos = inp.selectionStart; const sc = $('.prod-items')?.scrollTop; renderProdutos(); const n = $('#pr-busca'); n.focus(); n.setSelectionRange(pos, pos); });
}

/* ---------------- CLIENTES ---------------- */
function renderClientes(){
  const A = agg(perFatos(S.mes)), B = S.cmp ? agg(perFatos(S.cmp)) : null;
  const ccs = new Set([...clientesDoVendedor(), ...A.cli.keys(), ...(B ? B.cli.keys() : [])]);
  let rows = [...ccs].map(cc => {
    const a = A.cli.get(cc)?.val || 0, b = B?.cli.get(cc)?.val || 0, s = situacao(cc);
    return {cc, nome: S.cliNome[cc] || cc, vend: S.vendNome[vendAtual(cc)] || '', val: a, cmp: b, var: b ? (a - b) / Math.abs(b) : (a ? Infinity : 0), dias: s.dias ?? (s.tipo in STATUS_TXT ? 9999 : -1), s, rec: S.recencia[cc]?.fim || ''};
  });
  const q = S.cliBusca.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.nome.toLowerCase().includes(q) || r.cc === q);
  const f = S.cliFiltro;
  if (f === 'compraram') rows = rows.filter(r => r.val > 0);
  if (f === 'alerta') rows = rows.filter(r => r.s.tipo === 'alerta' || r.s.tipo === 'atencao');
  if (f === 'marcados') rows = rows.filter(r => r.s.tipo in STATUS_TXT);
  const {k, dir} = S.cliSort;
  rows.sort((x, y) => (typeof x[k] === 'string' ? x[k].localeCompare(y[k]) : (x[k] - y[k])) * dir || x.nome.localeCompare(y.nome));
  const th = (key, lbl, r) => `<th class="sort ${r ? 'r' : ''}" data-k="${key}">${lbl}${k === key ? (dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  $('#main').innerHTML = `<div class="card">
    <div class="toolbar">
      <input class="i" id="cli-busca" placeholder="Buscar cliente por nome ou código…" value="${esc(S.cliBusca)}">
      <span class="seg" id="cli-filtro">${[['todos','Todos'],['compraram','Compraram no período'],['alerta','Sem compra'],['marcados','Fechou/Devendo']].map(([v, l]) => `<button data-f="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</span>
      <span class="help" style="margin-left:auto">${rows.length} cliente(s) · clique para ver produtos</span>
    </div>
    <div class="tbl-wrap"><table class="t"><thead><tr>
      ${th('nome','Cliente')}${S.vend ? '' : th('vend','Vendedor')}${th('val', esc(perLabelCurto(S.mes)), 1)}${B ? th('cmp', esc(perLabelCurto(S.cmp)), 1) + th('var','Var.', 1) : ''}${th('rec','Última compra')}${th('dias','Situação')}
    </tr></thead><tbody>
    ${rows.map(r => `<tr class="click" data-cc="${esc(r.cc)}"><td><div class="cname">${esc(r.nome)}</div><div class="ccode">cód. ${esc(r.cc)}</div></td>${S.vend ? '' : `<td>${esc(r.vend)}</td>`}<td class="r num">${r.val ? fmtBRL(r.val) : '<span class="ccode">—</span>'}</td>${B ? `<td class="r num">${r.cmp ? fmtBRL(r.cmp) : '<span class="ccode">—</span>'}</td><td class="r">${deltaHTML(r.val, r.cmp)}</td>` : ''}<td class="num">${ultimaCompraTxt(r.cc)}</td><td>${badgeSit(r.cc)}</td></tr>`).join('') || `<tr><td colspan="7" class="empty">Nenhum cliente encontrado.</td></tr>`}
    </tbody></table></div></div>`;
  const inp = $('#cli-busca');
  inp.addEventListener('input', () => { S.cliBusca = inp.value; const pos = inp.selectionStart; renderClientes(); const n = $('#cli-busca'); n.focus(); n.setSelectionRange(pos, pos); });
  $$('#cli-filtro button').forEach(b => b.addEventListener('click', () => { S.cliFiltro = b.dataset.f; renderClientes(); }));
  $$('#main th.sort').forEach(h => h.addEventListener('click', () => { const kk = h.dataset.k; S.cliSort = {k: kk, dir: S.cliSort.k === kk ? -S.cliSort.dir : (['nome','vend'].includes(kk) ? 1 : -1)}; renderClientes(); }));
  $$('#main tr.click').forEach(tr => tr.addEventListener('click', () => abrirCliente(tr.dataset.cc)));
}

/* ---------------- ALERTAS ---------------- */
function renderAlertas(){
  const base = clientesDoVendedor();
  const lst = base.map(cc => ({cc, s: situacao(cc)}));
  // valor de referência: média mensal nos meses em que comprou
  const porMes = {};
  for (const m of S.meses) for (const r of S.fatos[m]) { const o = (porMes[r.cc] ||= {}); o[m] = (o[m] || 0) + r.val; }
  const MED = {}; for (const [cc, o] of Object.entries(porMes)) { const v = Object.values(o).filter(x => x > 0); MED[cc] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
  const media = cc => MED[cc] || 0;
  const al = lst.filter(x => x.s.tipo === 'alerta').sort((a,b) => media(b.cc) - media(a.cc));
  const at = lst.filter(x => x.s.tipo === 'atencao').sort((a,b) => media(b.cc) - media(a.cc));
  const mk = lst.filter(x => x.s.tipo in STATUS_TXT).sort((a,b) => (b.s.st.em || '').localeCompare(a.s.st.em || ''));
  const tbl = (arr, vazio, extra) => arr.length ? `<div class="tbl-wrap" style="max-height:520px"><table class="t"><thead><tr><th>Cliente</th>${S.vend ? '' : '<th>Vendedor</th>'}<th>Última compra</th><th class="r">Média mensal</th><th>${extra ? 'Motivo' : 'Situação'}</th></tr></thead><tbody>
    ${arr.map(({cc, s}) => `<tr class="click" data-cc="${esc(cc)}"><td><div class="cname">${esc(S.cliNome[cc])}</div><div class="ccode">cód. ${esc(cc)}</div></td>${S.vend ? '' : `<td>${esc(S.vendNome[vendAtual(cc)] || '')}</td>`}<td class="num">${ultimaCompraTxt(cc)}</td><td class="r num">${fmtBRL(media(cc))}</td><td>${badgeSit(cc)}${extra && s.st?.obs ? `<div class="ccode" style="max-width:280px">${esc(s.st.obs)}</div>` : ''}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">${vazio}</div>`;
  $('#main').innerHTML = `
    <div class="card" style="margin-bottom:14px"><div class="help">O relatório não traz a data de cada venda, só o período do arquivo. A <b>última compra</b> é o fim do último arquivo (semana ou mês) em que o cliente aparece, comparado com a data mais recente carregada (<b>${isoToBR(S.dataRef)}</b>). Mais de ${ALERTA_DIAS} dias acende o alerta. Clientes marcados como <b>Fechou</b>, <b>Devendo</b> ou <b>Outro motivo</b> saem do alerta e ficam na lista de baixo.</div></div>
    <div class="card"><h2>⚠ Sem compra há mais de 2 semanas · ${al.length}</h2><p class="sub">Maiores clientes primeiro (pela média mensal de compra). Clique para ver os produtos e registrar o motivo.</p>${tbl(al, 'Nenhum cliente em alerta. 🎉')}</div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h2>◷ Atenção: entre 8 e 14 dias · ${at.length}</h2><p class="sub">Ainda não é alerta, mas vale um contato. Maiores clientes primeiro.</p>${tbl(at, 'Ninguém nesta faixa.')}</div>
      <div class="card"><h2>Motivo registrado · ${mk.length}</h2><p class="sub">Clientes que fecharam, estão devendo ou pararam por outro motivo.</p>${tbl(mk, 'Nenhum cliente marcado ainda.', true)}</div>

}

  const nome = S.cliNome[cc] || cc;
  const doMes = k => { const map = new Map(); for (const r of perMeses(k).flatMap(m => S.fatos[m])) if (r.cc === cc) { const p = map.get(r.p) || {q: 0, val: 0}; p.q += r.q; p.val += r.val; map.set(r.p, p); } return map; };
  const A = doMes(S.mes), B = S.cmp ? doMes(S.cmp) : null;
  const prods = [...new Set([...A.keys(), ...(B ? B.keys() : [])])].map(p => ({p, l: linhaDe(p), a: A.get(p), b: B?.get(p)}));
  if (S.drCli !== cc) { S.drCli = cc; S.drBusca = ''; }
  const totA = [...A.values()].reduce((s, x) => s + x.val, 0), totB = B ? [...B.values()].reduce((s, x) => s + x.val, 0) : null;
  const hist = S.meses.map(m => { let v = 0; for (const r of S.fatos[m]) if (r.cc === cc) v += r.val; return v; });

  const vend = S.vendNome[vendAtual(cc)] || '—';
  $('#drawer').innerHTML = `
    <div class="drawer-head"><div style="flex:1;min-width:0"><h3>${esc(nome)}</h3><div class="ccode">cód. ${esc(cc)} · Vendedor: ${esc(vend)}</div><div style="margin-top:8px">${badgeSit(cc)}</div></div><button class="btn sm" id="dr-close" aria-label="Fechar">✕ Fechar</button></div>
    <div class="drawer-body">
      <div class="facts">
        <div class="fact"><div class="lbl">${esc(perLabel(S.mes))}</div><div class="val num">${fmtBRL(totA)}</div>${B ? `<div class="ccode">${deltaHTML(totA, totB)} vs ${esc(perLabel(S.cmp))}</div>` : ''}</div>
        <div class="fact"><div class="lbl">${B ? esc(perLabel(S.cmp)) : 'Comparação'}</div><div class="val num">${B ? fmtBRL(totB) : '—'}</div></div>
        <div class="fact"><div class="lbl">Última compra</div><div class="val" style="font-size:14px">${ultimaCompraTxt(cc)}</div></div>
      </div>
      <div class="card"><h2>Produtos comprados · ${esc(perLabel(S.mes))}</h2><p class="sub">${A.size} produto(s)${B ? ' · comparado com ' + esc(perLabel(S.cmp)) : ''}</p>
        ${prods.length ? `<div class="toolbar" style="margin-bottom:8px"><input class="i" id="dr-busca" placeholder="Buscar produto ou linha (ex.: arroz)…" value="${esc(S.drBusca)}" style="max-width:300px"><span class="help">Clique no título da coluna para ordenar</span></div><div id="dr-prods"></div>` : `<div class="empty">Este cliente não comprou em ${esc(perLabel(S.mes))}${B ? ' nem em ' + esc(perLabel(S.cmp)) : ''}.</div>`}
      </div>
      <div class="card"><h2>Histórico mensal</h2><p class="sub">Venda líquida por mês (todos os vendedores)</p><div class="chart-box" style="height:200px"><canvas id="ch-cli"></canvas></div></div>
      <div class="card"><h2>Situação do cliente</h2><p class="sub">Registre por que o cliente parou de comprar. Com um motivo marcado, ele sai do alerta.</p>
        <div class="status-opts" id="st-opts">
          ${[['', 'Normal (sem motivo)'], ['fechou', 'Fechou'], ['devendo', 'Devendo'], ['outro', 'Outro motivo']].map(([v, l]) => `<label><input type="radio" name="st" value="${v}" ${st.status === v ? 'checked' : ''}> ${l}</label>`).join('')}
        </div>

        <textarea class="i" id="st-obs" rows="3" maxlength="1000" placeholder="Ex.: restaurante fechou em fevereiro; deve 2 boletos de janeiro; mudou de fornecedor…">${esc(st.obs || '')}</textarea>

  // tabela de produtos do cliente: ordenável e com busca, sem redesenhar a gaveta inteira

    const st = S.drSort;
    ordenar(lst, {p: x => x.p, l: x => x.l, aq: x => x.a?.q ?? null, av: x => x.a?.val ?? null, bq: x => x.b?.q ?? null, bv: x => x.b?.val ?? null}, st);

    const tqb = lst.reduce((s2, x) => s2 + (x.b?.q || 0), 0), tvb = lst.reduce((s2, x) => s2 + (x.b?.val || 0), 0);

      </tbody><tfoot><tr><td colspan="2"><b>Total${q ? ' do filtro' : ''} · ${lst.length} produto(s)</b></td><td class="r num"><b>${fmtQ(tq)}</b></td><td class="r num"><b>${fmtBRL(tv)}</b></td>${B ? `<td class="r num"><b>${fmtQ(tqb)}</b></td><td class="r num"><b>${fmtBRL(tvb)}</b></td>` : ''}</tr></tfoot></table></div>`;
    $$('#dr-prods th.sort').forEach(h => h.onclick = () => { S.drSort = proximaOrdem(S.drSort, h.dataset.sk, ['p', 'l'].includes(h.dataset.sk)); desenharProds(); });
  };
  desenharProds();
  $('#dr-busca')?.addEventListener('input', e => { S.drBusca = e.target.value; desenharProds(); });
  $('#dr-close').onclick = fecharDrawer;

    const btn = $('#st-save'); btn.disabled = true; $('#st-msg').textContent = 'Salvando…';

    try {
      await S.store.setStatus(cc, obj);
      if (!obj.status && !obj.obs) delete S.status[cc]; else S.status[cc] = obj;
      toast('Situação salva'); abrirCliente(cc); render();
    } catch (e) { $('#st-msg').textContent = erroFirebase(e); btn.disabled = false; }
  };
}
function fecharDrawer(){ $('#drawer').classList.add('hidden'); $('#drawer-bg').classList.add('hidden'); if (charts['ch-cli']) { charts['ch-cli'].destroy(); delete charts['ch-cli']; } }
$('#drawer-bg').addEventListener('click', fecharDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharDrawer(); });

/* ---------------- ARQUIVOS (admin) ---------------- */
let pendentes = [];
function renderArquivos(){
  if (!isAdmin()) { S.tab = 'painel'; return render(); }
  const lst = [...S.arquivos].sort((a,b) => a.inicio < b.inicio ? 1 : -1);
  const usado = a => S.mesInfo[a.mes]?.usados.some(u => u.id === a.id);
  $('#main').innerHTML = `
    <div class="card">
      <h2>Carregar relatório de vendas</h2>
      <p class="sub">Use o <b>Relatório de Análise de Vendas - Vendedor - Cliente (Detalhado) - Produto</b> exportado em <b>HTML</b>. O sistema identifica o período. Se for de 1º ao último dia do mês, é tratado como <b>mensal</b>; se não, como <b>semanal</b>. O mensal substitui as semanas daquele mês no total. Carregar de novo o mesmo período substitui o anterior.</p>
      <label class="drop" id="drop"><input type="file" id="file" accept=".html,.htm" multiple hidden><strong>Arraste os arquivos aqui ou clique para escolher</strong><span>Pode carregar vários de uma vez (.html)</span></label>
      <div id="pend"></div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Arquivos carregados · ${lst.length}</h2><p class="sub">"Substituído" = semana que já está coberta pelo fechamento mensal (continua servindo para a data da última compra).</p>
      ${lst.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Tipo</th><th>Período</th><th>Mês</th><th class="r">Venda líquida</th><th class="r">Linhas</th><th>Enviado</th><th>Uso</th><th></th></tr></thead><tbody>
      ${lst.map(a => `<tr><td><span class="badge ${a.tipo === 'mensal' ? 'outro' : 'gray'}">${a.tipo === 'mensal' ? 'Mensal' : 'Semanal'}</span></td><td class="num">${isoToBR(a.inicio)} a ${isoToBR(a.fim)}</td><td>${mesLabel(a.mes)}</td><td class="r num">${fmtBRL(a.total)}</td><td class="r num">${fmtN(a.linhas)}</td><td class="ccode">${esc(a.enviadoPor || '')}<br>${a.enviadoEm ? new Date(a.enviadoEm).toLocaleString('pt-BR') : ''}</td><td>${usado(a) ? '<span class="badge ok">Em uso</span>' : '<span class="badge gray">Substituído</span>'}</td><td class="r"><button class="btn sm danger" data-del="${esc(a.id)}">Excluir</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Nenhum arquivo ainda.</div>'}
    </div>`;
  const drop = $('#drop'), inp = $('#file');
  inp.addEventListener('change', () => lerArquivos(inp.files));
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => lerArquivos(e.dataTransfer.files));
  $$('[data-del]').forEach(b => b.addEventListener('click', async () => {
    const a = S.arquivos.find(x => x.id === b.dataset.del);
    if (!confirm(`Excluir o arquivo ${a.tipo} de ${isoToBR(a.inicio)} a ${isoToBR(a.fim)}?`)) return;
    b.disabled = true;
    try { await S.store.deleteArquivo(a.id); S.arquivos = S.arquivos.filter(x => x.id !== a.id); delete S.payloads[a.id]; recalcular(); ajustarMes(); toast('Arquivo excluído'); render(); }
    catch (e) { alert(erroFirebase(e)); b.disabled = false; }
  }));
  renderPendentes();
}
async function lerArquivos(files){
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      let txt = new TextDecoder('utf-8').decode(buf);
      if (txt.includes('\uFFFD')) txt = new TextDecoder('windows-1252').decode(buf);
      pendentes.push({ok: true, ...parseRelatorio(txt, f.name)});
    } catch (e) { pendentes.push({ok: false, nomeArquivo: f.name, erro: e.message}); }
  }
  renderPendentes();
}
function renderPendentes(){
  const el = $('#pend'); if (!el) return;
  el.innerHTML = pendentes.map((p, i) => {
    if (!p.ok) return `<div class="preview"><h4>${esc(p.nomeArquivo)}</h4><div class="msg err">${esc(p.erro)}</div><div class="row-actions"><button class="btn sm" data-rm="${i}">Remover</button></div></div>`;
    p.mes = p.tipo === 'mensal' ? p.inicio.slice(0,7) : mesDoPeriodo(p.inicio, p.fim);
    const id = idArquivo(p), existe = S.arquivos.find(a => a.id === id);
    const confere = p.totalRelatorio == null ? null : Math.abs(p.totalRelatorio - p.total) < 1;
    const semanasCobertas = p.tipo === 'mensal' ? S.arquivos.filter(a => a.tipo === 'semanal' && a.mes === p.mes).length : 0;
    const temMensal = p.tipo === 'semanal' && S.arquivos.some(a => a.tipo === 'mensal' && a.mes === p.mes);
    return `<div class="preview"><h4>${esc(p.nomeArquivo)}</h4>
      <div class="kv">
        <div><b>Período</b>${isoToBR(p.inicio)} a ${isoToBR(p.fim)}</div>
        <div><b>Tipo</b><select class="i" data-tipo="${i}" style="padding:4px 8px;margin-top:2px"><option value="semanal" ${p.tipo==='semanal'?'selected':''}>Semanal</option><option value="mensal" ${p.tipo==='mensal'?'selected':''}>Mensal</option></select></div>
        <div><b>Conta no mês</b>${mesLabel(p.mes)}</div>
        <div><b>Venda líquida</b><span class="num">${fmtBRL(p.total)}</span></div>
        <div><b>Linhas</b>${fmtN(p.linhas)}</div>
        <div><b>Vendedores</b>${p.vendedores}</div>
        <div><b>Clientes</b>${p.clientes}</div>
        <div><b>Produtos</b>${p.produtos}</div>
      </div>
      ${confere === true ? `<div class="msg ok">✓ Confere com o total do relatório (${fmtBRL(p.totalRelatorio)}).</div>` : confere === false ? `<div class="msg err">A soma das linhas (${fmtBRL(p.total)}) não bate com o total do relatório (${fmtBRL(p.totalRelatorio)}). Confira o arquivo antes de salvar.</div>` : ''}
      ${existe ? `<div class="msg info">Já existe um arquivo ${p.tipo} para este período. Ao salvar, ele será <b>substituído</b>.</div>` : ''}
      ${semanasCobertas ? `<div class="msg info">Este fechamento mensal vai substituir ${semanasCobertas} arquivo(s) semanal(is) de ${mesLabel(p.mes)} no total do mês.</div>` : ''}
      ${temMensal ? `<div class="msg info">${mesLabel(p.mes)} já tem fechamento mensal, então esta semana não entra no total do mês. Ela só atualiza a data da última compra e o gráfico semanal.</div>` : ''}
      <div class="row-actions"><button class="btn primary" data-save="${i}">Salvar no sistema</button><button class="btn" data-rm="${i}">Cancelar</button><span class="help" id="sv-${i}"></span></div>
    </div>`;
  }).join('') + (pendentes.filter(p => p.ok).length > 1 ? `<div class="row-actions"><button class="btn primary" id="save-all">Salvar todos (${pendentes.filter(p => p.ok).length})</button></div>` : '');
  $$('[data-rm]').forEach(b => b.onclick = () => { pendentes.splice(+b.dataset.rm, 1); renderPendentes(); });
  $$('[data-tipo]').forEach(s => s.onchange = () => { pendentes[+s.dataset.tipo].tipo = s.value; renderPendentes(); });
  $$('[data-save]').forEach(b => b.onclick = () => salvarPendentes([+b.dataset.save]));
  $('#save-all')?.addEventListener('click', () => salvarPendentes(pendentes.map((p, i) => p.ok ? i : -1).filter(i => i >= 0)));
}
async function salvarPendentes(idxs){
  $$('#pend button').forEach(b => b.disabled = true);
  const feitos = [];
  for (const i of idxs) {
    const p = pendentes[i]; const msg = $('#sv-' + i); if (msg) msg.textContent = 'Salvando…';
    const id = idArquivo(p);
    const meta = {tipo: p.tipo, inicio: p.inicio, fim: p.fim, mes: p.mes, nomeArquivo: p.nomeArquivo, emissao: p.emissao, total: p.total, qtd: p.qtd, linhas: p.linhas, clientes: p.clientes, enviadoPor: S.email, enviadoEm: new Date().toISOString()};
    try {
      await S.store.saveArquivo(id, meta, p.payload);
      S.arquivos = S.arquivos.filter(a => a.id !== id).concat({id, ...meta});
      S.payloads[id] = decode(p.payload);
      feitos.push(i);
    } catch (e) { if (msg) msg.textContent = erroFirebase(e); }
  }
  pendentes = pendentes.filter((_, i) => !feitos.includes(i));
  recalcular(); if (feitos.length) { ajustarMes(true); toast(feitos.length + ' arquivo(s) salvo(s)'); }
  render();
}

        ${us.map(u => `<tr><td>${esc(u.nome || '—')}</td><td>${esc(u.email)}</td><td><select class="i" data-papel="${esc(u.uid)}" style="padding:4px 8px;width:auto" ${u.email === S.email ? 'disabled' : ''}><option value="visualizador" ${u.papel==='visualizador'?'selected':''}>Visualizador</option><option value="admin" ${u.papel==='admin'?'selected':''}>Administrador</option></select></td><td class="r">${u.email === S.email ? '<span class="help">você</span>' : `<button class="btn sm danger" data-rmu="${esc(u.uid)}">Remover acesso</button>`}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">Nenhum usuário cadastrado.</div>';
      $$('[data-papel]').forEach(s => s.onchange = async () => { try { await S.store.setPapel(s.dataset.papel, s.value); toast('Acesso atualizado'); } catch (e) { alert(erroFirebase(e)); } });
      $$('[data-rmu]').forEach(b => b.onclick = async () => { if (!confirm('Remover o acesso deste usuário? Ele não conseguirá mais ver o painel.')) return; try { await S.store.removerUsuario(b.dataset.rmu); toast('Acesso removido'); carregar(); } catch (e) { alert(erroFirebase(e)); } });
    } catch (e) { $('#u-list').innerHTML = `<div class="msg err">${esc(erroFirebase(e))}</div>`; }
  };
  carregar();
  $('#u-form').onsubmit = async e => {
    e.preventDefault(); const msg = $('#u-msg'); msg.className = 'msg info'; msg.textContent = 'Criando…';
    try { await S.store.criarUsuario($('#u-email2').value.trim(), $('#u-senha').value, $('#u-nome').value.trim(), $('#u-papel').value); msg.className = 'msg ok'; msg.textContent = 'Usuário criado. Envie o e-mail e a senha para a pessoa.'; e.target.reset(); carregar(); }
    catch (err) { msg.className = 'msg err'; msg.textContent = erroFirebase(err); }
  };
}

/* =====================================================================
   INICIALIZAÇÃO
   ===================================================================== */
function ajustarMes(force){
  if (!S.meses.length) { S.ano = ''; S.mesSel = ''; S.mes = null; S.cmp = ''; return; }
  const ultimo = S.meses[S.meses.length - 1];
  if (force) { S.ano = ultimo.slice(0, 4); S.mesSel = ultimo; }
  if (S.ano && !anosDisp().includes(S.ano)) { S.ano = ultimo.slice(0, 4); S.mesSel = ''; }
  if (S.mesSel && !S.meses.includes(S.mesSel)) S.mesSel = '';
  definirPeriodo(!force);
}
async function carregarDados(){
  $('#main').innerHTML = '<div class="loading">Carregando dados de vendas…</div>';
  const [arqs, status] = await Promise.all([S.store.listArquivos(), S.store.listStatus()]);
  S.arquivos = arqs; S.status = status;
  await Promise.all(arqs.map(async a => { if (!S.payloads[a.id]) S.payloads[a.id] = decode(await S.store.getPayload(a.id)); }));
  recalcular(); ajustarMes(true);
}
function mostrarLogin(msg){
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#login-form').classList.toggle('hidden', DEMO); $('#forgot-wrap').classList.toggle('hidden', DEMO);
  $('#demo-login').classList.toggle('hidden', !DEMO);
  if (DEMO) $('#login-sub').innerHTML = '<b>Modo demonstração.</b> O Firebase ainda não foi configurado no <code>config.js</code>. Escolha um perfil para testar.';
  $('#login-msg').innerHTML = msg ? `<div class="msg err">${esc(msg)}</div>` : '';
}
async function entrou(){
  S.perfil = await S.store.perfil();
  if (!S.perfil) { await S.store.logout(); return mostrarLogin('Seu usuário ainda não tem acesso ao painel. Peça ao administrador para cadastrar você.'); }
  S.email = S.store.currentEmail();
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#u-email').textContent = S.email;
  $('#u-role').innerHTML = (S.store.demo ? '<span class="pill demo">Demonstração</span> ' : '') + (isAdmin() ? '<span class="pill admin">Administrador</span>' : '<span class="pill view">Visualizador</span>');
  $$('#tabs .adm').forEach(b => b.classList.toggle('hidden', !isAdmin()));
  $('#demo-banner').classList.toggle('hidden', !S.store.demo);
  if (!isAdmin() && (S.tab === 'arquivos' || S.tab === 'usuarios')) S.tab = 'painel';
  try { await carregarDados(); } catch (e) { $('#main').innerHTML = `<div class="card"><div class="msg err">Não foi possível carregar os dados: ${esc(erroFirebase(e))}</div></div>`; return; }
  if (!S.meses.length && isAdmin()) S.tab = 'arquivos';
  render();
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (!b) return; S.tab = b.dataset.tab; fecharDrawer(); render(); window.scrollTo(0, 0); });
$('#f-ano').addEventListener('change', e => { S.ano = e.target.value; S.mesSel = ''; definirPeriodo(); render(); });
$('#f-mes').addEventListener('change', e => { S.mesSel = e.target.value; definirPeriodo(); render(); });
$('#f-cmp').addEventListener('change', e => { S.cmp = e.target.value; render(); });
$('#f-vend').addEventListener('change', e => { S.vend = e.target.value; render(); });
$('#logout').addEventListener('click', () => S.store.logout());
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('#lg-btn'); b.disabled = true; b.textContent = 'Entrando…';
  try { await S.store.login($('#lg-email').value.trim(), $('#lg-pass').value); }
  catch (err) { $('#login-msg').innerHTML = `<div class="msg err">${esc(erroFirebase(err))}</div>`; }
  b.disabled = false; b.textContent = 'Entrar';
});
$('#forgot').addEventListener('click', async () => {
  const email = $('#lg-email').value.trim();
  if (!email) { $('#login-msg').innerHTML = '<div class="msg info">Digite seu e-mail no campo acima e clique de novo em "Esqueci minha senha".</div>'; return; }
  try { await S.store.resetSenha(email); $('#login-msg').innerHTML = '<div class="msg ok">Enviamos um link para redefinir a senha. Confira seu e-mail (e a caixa de spam).</div>'; }
  catch (err) { $('#login-msg').innerHTML = `<div class="msg err">${esc(erroFirebase(err))}</div>`; }
});
$$('[data-demo]').forEach(b => b.addEventListener('click', () => S.store.loginDemo(b.dataset.demo)));

(async function boot(){
  try { S.store = DEMO ? makeDemoStore() : await makeFirebaseStore(); }
  catch (e) { document.body.innerHTML = `<div class="loading">Não foi possível conectar ao Firebase. Confira a internet e o arquivo config.js.<br><small>${esc(e.message)}</small></div>`; return; }
  S.store.onAuth(u => { if (u) entrou(); else { S.perfil = null; mostrarLogin(); } });
  await S.store.init();
})();
</script>
